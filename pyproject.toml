[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-status-bar"
version = "0.1.0"
description = "macOS menu bar status for the OpenCode desktop app"
requires-python = ">=3.12"
dependencies = [
    "rumps>=0.4.0",
    "loguru>=0.7.3",
]

[project.scripts]
opencode-status-bar = "opencode_status_bar.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 30
timeout_method = "thread"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "e2e: end-to-end tests",
]

# Parallel execution; loadgroup keeps each xdist_group on one worker
addopts = "-n auto --dist loadgroup"

# Force test isolation
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=4.0.0",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    # tools/pycode
    "jedi>=0.19.0",
    "radon>=6.0.1",
    "ruff>=0.9.0",
    "vulture>=2.14",
]
